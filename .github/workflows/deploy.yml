name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/pulse-app # Ajuste para o caminho real na sua VPS
            git pull origin main
            
            # Instala dependências e gera o build
            # Usando --frozen-lockfile ou ci para garantir reprodutibilidade
            npm ci
            npm run build
            
            # Se você usa PM2 para servir ou Nginx para estáticos, 
            # o build na pasta dist/ já estará pronto para o servidor.
            # Caso precise reiniciar algum serviço:
            # sudo systemctl restart nginx
